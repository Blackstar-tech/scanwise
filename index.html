<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScanWise Local Preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f8fc;
        --card: #ffffff;
        --ink: #152033;
        --muted: #526174;
        --line: #d9e2ef;
        --blue: #155eef;
        --blue-dark: #0f3d99;
        --code: #edf4ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at top left, rgba(21, 94, 239, 0.12), transparent 32rem),
          var(--bg);
        color: var(--ink);
        padding: 20px;
      }

      main {
        width: min(92vw, 520px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 28px;
        box-shadow: 0 18px 40px rgba(21, 32, 51, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      a,
      button {
        border-radius: 8px;
        font: inherit;
        font-weight: 700;
      }

      a {
        color: var(--blue);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border: 1px solid var(--blue);
        background: var(--blue);
        color: #ffffff;
        padding: 0 16px;
        text-decoration: none;
      }

      button {
        min-height: 42px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--blue-dark);
        cursor: pointer;
        padding: 0 16px;
      }

      code {
        display: inline-block;
        border-radius: 6px;
        background: var(--code);
        color: var(--blue-dark);
        font-family: Consolas, "SFMono-Regular", monospace;
        font-weight: 700;
        padding: 2px 6px;
      }

      .status {
        margin-top: 18px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
        font-size: 14px;
      }
    </style>
    <script>
      const appUrl = "http://localhost:3001";

      async function checkNextServer() {
        const status = document.querySelector("[data-status]");
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 1500);

        try {
          await fetch(appUrl, {
            cache: "no-store",
            mode: "no-cors",
            signal: controller.signal
          });
          status.textContent = "Next.js server found. Opening ScanWise...";
          window.location.replace(appUrl);
        } catch {
          status.textContent =
            "Next.js server is not running yet. Start it with npm run dev, then try again.";
        } finally {
          window.clearTimeout(timeout);
        }
      }

      window.addEventListener("DOMContentLoaded", checkNextServer);
    </script>
  </head>
  <body>
    <main>
      <h1>ScanWise Local Preview</h1>
      <p>
        This project runs with Next.js. VS Code Live Server can open this helper page, but
        the app itself must be started with <code>npm run dev</code>.
      </p>
      <div class="actions">
        <a class="button" href="http://localhost:3001">Open App</a>
        <button type="button" onclick="checkNextServer()">Try Again</button>
      </div>
      <p class="status" data-status>Checking for the Next.js server...</p>
    </main>
  </body>
</html>
